# =============================================================================
# MCG Demo — Simulator Services
# =============================================================================
# Run alongside the Kafka stack (infrastructure/kafka/docker-compose.yml)
# or standalone with external infrastructure.
#
# Databases in this file:
#   postgres  — the WMS, on host port 5432, CDC via logical replication
#   mysql     — Meridian CRM, on host port 3307, CDC via the binary log
#
# Usage (with Kafka stack):
#   npm run docker:up:kafka && npm run docker:up:simulators
#
# Usage (standalone — simulators only, external Kafka/PG):
#   npm run docker:up:simulators
#
#   PREREQUISITE: the Kafka stack must already be running and reachable on
#   the "mcg-kafka-net" external network before starting kafka-iot-simulator
#   — e.g. via `npm run docker:up:kafka` (infrastructure/kafka/docker-compose.yml)
#   or the full-stack compose file. This file does NOT define or start the
#   "kafka" service itself; kafka-iot-simulator connects to it purely via the
#   KAFKA_BOOTSTRAP environment variable / network alias, not an in-file
#   depends_on (Compose cannot depend_on a service undefined in this file).
#
# Usage (full stack — everything in one command):
#   npm run docker:up
# (The npm scripts route through deploy/compose.js, which resolves podman or
# docker automatically and wires DOCKER_HOST for Podman's compose provider.
# This host has no Docker, so calling `docker compose` directly will fail.)
#
# Network connectivity:
#   - All simulator containers can reach each other via service names
#   - Kafka IoT simulator joins the Kafka network to reach the broker
#   - All containers can reach host services via host.docker.internal
#   - PostgreSQL port 5432 is exposed to the host for Qlik Data Gateway
#   - MySQL is published on host port 3307, not 3306: the Data Movement
#     Gateway container (docker-compose.dmg.yml) already claims 3306. Inside
#     the compose network the CRM is plain mysql:3306.
#   - Kafka ports 9092/29092 are exposed via the Kafka stack
#
# Environment variables can be set in .env or passed directly.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — WMS Database for CDC simulation
  # ---------------------------------------------------------------------------
  # Exposes port 5432 to the host so Qlik Data Movement Gateway can connect.
  # Also accessible from other containers via hostname "postgres" on mcg-sim-net.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mcg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcg_wms}
      POSTGRES_USER: ${POSTGRES_USER:-mcg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcg_demo_2025}
      # Enable data page checksums to detect on-disk corruption (set at initdb).
      # Logical replication for Qlik CDC is enabled separately via
      # wal_level=logical in the command: block below.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # NOTE: binds host port 5432 by default — do not run this stack at the same
    # time as the DMG-based stack (docker-compose.dmg.yml / docker:up:dmg-only),
    # whose qlik-dmg container also defaults to host port 5432. Only one can bind
    # the port at a time; override POSTGRES_PORT if you need both simultaneously.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mcg-sim-net
      - mcg-kafka-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcg_admin} -d ${POSTGRES_DB:-mcg_wms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MySQL — Meridian CRM database for CDC
  # ---------------------------------------------------------------------------
  # The customer system of record: contacts, orders and the product master.
  # Qlik reads it over log-based CDC through the Data Movement Gateway.
  #
  # Published on host port 3307 because the all-in-one gateway container
  # (docker-compose.dmg.yml) binds 3306. Container-to-container traffic still
  # uses mysql:3306, so the gateway connection is unaffected by the host port.
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: mcg-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mcg_root_2025}
      MYSQL_DATABASE: ${MYSQL_DB:-mcg_crm}
      MYSQL_USER: ${MYSQL_USER:-qlik_cdc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mcg_crm_2025}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs once, as root, on a fresh volume: adds the binlog-reading grants
      # that CDC needs and that MYSQL_USER alone does not get.
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - mcg-sim-net
      - mcg-kafka-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mcg_root_2025}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Binlog settings for log-based CDC. MySQL 8.4 already defaults to
    # log_bin=ON with ROW format and FULL row images; they are stated here so
    # the CDC contract is visible in the stack definition rather than implied.
    # binlog-format is deliberately NOT set: it is deprecated in 8.4, emits a
    # startup warning, and ROW is forced regardless.
    command: >
      mysqld
        --server-id=1
        --log-bin=mysql-bin
        --binlog-row-image=FULL
        --binlog-expire-logs-seconds=604800
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Seed Data — One-shot container to populate both databases with demo data
  # ---------------------------------------------------------------------------
  # Seeds the WMS (PostgreSQL) and Meridian CRM (MySQL) in one pass. Both
  # paths are idempotent: a re-run on a populated database logs "already
  # seeded" and exits rather than duplicating the dataset.
  #
  # It connects to MySQL as root because it creates the database and schema.
  # The gateway and the CRM simulator use the lower-privileged qlik_cdc user.
  # ---------------------------------------------------------------------------
  seed-data:
    build:
      context: ../simulators
      dockerfile: Dockerfile
    container_name: mcg-seed-data
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: >
      python seed_data.py
        --postgres
        --pg-host postgres
        --pg-port 5432
        --pg-db ${POSTGRES_DB:-mcg_wms}
        --pg-user ${POSTGRES_USER:-mcg_admin}
        --pg-pass ${POSTGRES_PASSWORD:-mcg_demo_2025}
        --mysql
        --my-host mysql
        --my-port 3306
        --my-db ${MYSQL_DB:-mcg_crm}
        --my-user root
        --my-pass ${MYSQL_ROOT_PASSWORD:-mcg_root_2025}
    networks:
      - mcg-sim-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  # ---------------------------------------------------------------------------
  # PostgreSQL Simulator — Continuous WMS event generation
  # ---------------------------------------------------------------------------
  # Generates realistic inventory movements, warehouse events, and shipments.
  # Connects to the PostgreSQL container via the mcg-sim-net network.
  # Can also connect to a host-based PostgreSQL via host.docker.internal.
  # ---------------------------------------------------------------------------
  postgres-simulator:
    build:
      context: ../simulators
      dockerfile: Dockerfile
    container_name: mcg-postgres-simulator
    depends_on:
      seed-data:
        condition: service_completed_successfully
    command: >
      python postgres_simulator.py
        --host ${PG_SIM_HOST:-postgres}
        --port ${PG_SIM_PORT:-5432}
        --db ${POSTGRES_DB:-mcg_wms}
        --user ${POSTGRES_USER:-mcg_admin}
        --password ${POSTGRES_PASSWORD:-mcg_demo_2025}
    networks:
      - mcg-sim-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka IoT Simulator — Cold-chain sensor + carrier event production
  # ---------------------------------------------------------------------------
  # Produces messages to mcg.iot.cold-chain and mcg.iot.carrier-events topics.
  # Joins BOTH networks:
  #   - mcg-kafka-net: to reach the Kafka broker container (kafka:9092)
  #   - mcg-sim-net:   to be reachable by other simulator containers
  # Can also connect to a host-based Kafka via host.docker.internal:29092.
  # ---------------------------------------------------------------------------
  kafka-iot-simulator:
    build:
      context: ../simulators
      dockerfile: Dockerfile
    container_name: mcg-kafka-iot-simulator
    # No depends_on here: the "kafka" service is defined in
    # infrastructure/kafka/docker-compose.yml, not this file, and Compose
    # rejects a project with a depends_on referencing an undefined service.
    # Ensure the Kafka stack is already running (see header usage note above)
    # before starting this service — it connects via KAFKA_BOOTSTRAP below.
    command: >
      python kafka_iot_simulator.py
        --bootstrap-servers ${KAFKA_BOOTSTRAP:-kafka:9092}
    networks:
      - mcg-sim-net
      - mcg-kafka-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # CRM Simulator — Meridian CRM change generation (MySQL)
  # ---------------------------------------------------------------------------
  # Inserts contacts, orders and products, AND mutates them: it walks orders
  # along their lifecycle, repairs dirty addresses in place, and occasionally
  # purges an old order. Those updates and deletes are what make the binlog a
  # real change stream rather than an append log.
  #
  # Unlike the SaaS simulator this replaced, it needs no external account, no
  # credentials and no compose profile — it is a default service that comes up
  # with the rest of the stack. (The deploy UI cannot start profile-gated
  # services: startDockerJob never forwards a profiles option.)
  # ---------------------------------------------------------------------------
  mysql-crm-simulator:
    build:
      context: ../simulators
      dockerfile: Dockerfile
    container_name: mcg-mysql-crm-simulator
    depends_on:
      seed-data:
        condition: service_completed_successfully
    command: >
      python mysql_crm_simulator.py
        --host mysql
        --port 3306
        --db ${MYSQL_DB:-mcg_crm}
        --user ${MYSQL_USER:-qlik_cdc}
        --password ${MYSQL_PASSWORD:-mcg_crm_2025}
        --interval ${CRM_SIM_INTERVAL:-10}
    networks:
      - mcg-sim-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  mysql-data:
    driver: local

networks:
  mcg-sim-net:
    driver: bridge
    name: mcg-sim-net
  mcg-kafka-net:
    driver: bridge
    name: mcg-kafka-net
