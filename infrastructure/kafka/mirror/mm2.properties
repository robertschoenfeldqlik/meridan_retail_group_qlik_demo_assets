# =============================================================================
# MirrorMaker 2 — local IoT topics → Kafka EC2 in the lakehouse VPC
# =============================================================================
# The IoT simulator stays on this PC (gateway stack, mcg-kafka-net). The Qlik
# Open Lakehouse streaming cluster can only read Kafka inside the VPC, so this
# copies mcg.iot.* from the local broker to the Kafka EC2's PUBLIC listener
# (SASL_PLAINTEXT, port 29093, security group open to one IP only). The
# streaming landing task reads the same topics on the EC2's VPC listener
# (10.42.1.130:29092) through the "MCG IoT Telemetry" connection.
#
# The EC2 has no Elastic IP: after it is stopped and started, update
# aws.bootstrap.servers and the broker's PUBLIC advertised listener.
#
# The SASL password is read from secret.properties next to this file
# (gitignored), one line:  password=<KAFKA_SASL_PASSWORD from /opt/mcg/sasl.env>
#
# Run (podman):
#   podman run -d --name mcg-kafka-mirror --network mcg-kafka-net --restart unless-stopped \
#     -v "<repo>/infrastructure/kafka/mirror:/etc/mm2:ro" \
#     docker.io/confluentinc/cp-kafka:7.7.1 connect-mirror-maker /etc/mm2/mm2.properties
# =============================================================================

config.providers = file
config.providers.file.class = org.apache.kafka.common.config.provider.FileConfigProvider

clusters = local, aws
local.bootstrap.servers = kafka:9092
aws.bootstrap.servers = 54.174.2.213:29093
aws.security.protocol = SASL_PLAINTEXT
aws.sasl.mechanism = PLAIN
aws.sasl.jaas.config = org.apache.kafka.common.security.plain.PlainLoginModule required username="mcg" password="${file:/etc/mm2/secret.properties:password}";

# One direction only; keep the topic names as they are on the EC2.
local->aws.enabled = true
local->aws.topics = mcg\.iot\..*
aws->local.enabled = false
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# Single-broker clusters on both sides.
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

# The EC2 topics already exist with their own retention; don't overwrite them.
sync.topic.acls.enabled = false
sync.topic.configs.enabled = false
emit.checkpoints.enabled = false
emit.heartbeats.enabled = false

# Start from new messages, not the days of backlog in the local topics.
local->aws.consumer.auto.offset.reset = latest
