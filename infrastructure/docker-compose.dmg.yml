# =============================================================================
# MCG Demo — Qlik Data Movement Gateway + RDBMS Container
# =============================================================================
# Provides a single privileged container running:
#   - Qlik Data Movement Gateway (repagent)
#   - PostgreSQL 15 (port 5432)
#   - MySQL 8.0 (port 3306)
#   - SQL Server 2022 Developer (port 1433)
#   - SSH (port 22)
#
# This is an ALTERNATIVE to the standalone PostgreSQL in
# docker-compose.simulators.yml. Use this when you want the
# Data Movement Gateway co-located with the demo databases.
#
# Prerequisites:
#   1. Clone the submodule:
#      git submodule update --init
#   2. Download the Gateway RPM from:
#      https://github.com/qlik-download/hdd-replication-agent-artifacts/releases
#      Tested: v2026.5.37 -
#      https://github.com/qlik-download/hdd-replication-agent-artifacts/releases/download/v2026.5.37/qlik-data-gateway-data-movement-2026.5-37.x86_64.rpm
#      (or set docker.rpmUrl in deploy/config.json for auto-download)
#   3. Place the RPM as:
#      infrastructure/dmg/gateway/rpmfiles/gateway.rpm
#
# Usage (standalone):
#   npm run docker:up:dmg-only
#
# Usage (full stack with Kafka + simulators):
#   npm run docker:up:dmg
# (The npm scripts route through deploy/compose.js, which resolves podman or
# docker automatically and wires DOCKER_HOST for Podman's compose provider.
# This host has no Docker, so calling `docker compose` directly will fail.)
#
# After startup, find the registration token in the logs:
#   podman logs mcg-qlik-dmg 2>&1 | grep -A2 "Registration Token"
#
# Paste the token into Qlik Cloud:
#   Administration → Data Gateways → Register
#
# Default credentials:
#   PostgreSQL:  postgres / Qlik1234   (port 5432)
#   MySQL:       root / Qlik1234       (port 3306)
#
# NOTE: this container's MySQL is the gateway's own bundled instance. The
# Meridian CRM database lives in the standalone mysql service in
# docker-compose.simulators.yml (host port 3307). Only the DMG variant of the
# simulator stack points the CRM at this container instead.
#   SQL Server:  sa / Qlik1234!        (port 1433)
#   SSH:         qlikdmg / Qlik1234    (port 22)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Qlik Data Movement Gateway + RDBMS (all-in-one)
  # ---------------------------------------------------------------------------
  # Oracle Linux 9 container running systemd as PID 1.
  # Starts PostgreSQL 15, MySQL 8.0, SQL Server 2022, and the
  # Qlik Data Movement Gateway (repagent) as systemd services.
  #
  # The "postgres" network alias allows MCG simulators to connect
  # transparently — they resolve "postgres:5432" to this container.
  # ---------------------------------------------------------------------------
  qlik-dmg:
    build:
      context: dmg/gateway
      dockerfile: Dockerfile
    image: qlik-dmg:latest
    container_name: mcg-qlik-dmg
    privileged: true
    deploy:
      resources:
        limits:
          memory: 16g
    environment:
      TENANT_URL: ${TENANT_URL:-your-tenant.us.qlikcloud.com}
      POSTGRES_PASSWORD: ${DMG_POSTGRES_PASSWORD:-Qlik1234}
      MYSQL_ROOT_PASSWORD: ${DMG_MYSQL_PASSWORD:-Qlik1234}
      MSSQL_SA_PASSWORD: ${DMG_MSSQL_PASSWORD:-Qlik1234!}
      MSSQL_PID: Developer
      ACCEPT_EULA: "Y"
    ports:
      # PostgreSQL
      - "${DMG_PG_PORT:-5432}:5432"
      # MySQL
      - "${DMG_MYSQL_PORT:-3306}:3306"
      # SQL Server
      - "${DMG_MSSQL_PORT:-1433}:1433"
      # Qlik Data Movement Gateway
      - "3552:3552"
      - "8080:8080"
      - "8088:8088"
      - "8686:8686"
      # SSH
      - "${DMG_SSH_PORT:-2222}:22"
    volumes:
      - qlik-mysql-data:/var/lib/mysql
      # The WMS database, its logical replication slot and the shipment ids the
      # IoT feed joins on. Without a volume, any recreate (an image or memory
      # change) brings Postgres back empty: the reseed restarts shipment_id at 1
      # against the CRM that survived in qlik-mysql-data, and the CDC slot the
      # gateway task resumes from is gone. entrypoint.sh runs initdb only when
      # PG_VERSION is missing, so an empty volume initializes itself.
      - qlik-pgsql-data:/var/lib/pgsql/15/data
      # The gateway's identity lives here. Without a volume, recreating the
      # container mints a brand-new keypair, the tenant still holds the old
      # one, and the registered gateway sits "disconnected" forever with a
      # perfectly healthy agent running inside. Persisting it means you
      # register once, not once per rebuild.
      - qlik-gateway-data:/opt/qlik/gateway/movement/data
      - qlik-gateway-agents:/opt/qlik/gateway/movement/qcs_agents
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # NO network aliases. They used to be "postgres" and "mysql", which are the
    # service names of the standalone databases in docker-compose.simulators.yml
    # on this same network. Podman accepts the duplicate silently and aardvark-dns
    # returns BOTH A records, so a client resolving "mysql" reaches whichever
    # container joined first — the CRM simulator could write to one database while
    # the gateway CDC-reads the other, with no error anywhere. Everything that
    # needs this container addresses it as "qlik-dmg".
    networks:
      - mcg-sim-net
      - mcg-kafka-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "/usr/pgsql-15/bin/pg_isready -U postgres || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    restart: unless-stopped

volumes:
  qlik-mysql-data:
    driver: local
  qlik-pgsql-data:
    driver: local
  qlik-gateway-data:
    driver: local
  qlik-gateway-agents:
    driver: local

networks:
  mcg-sim-net:
    driver: bridge
    name: mcg-sim-net
  mcg-kafka-net:
    driver: bridge
    name: mcg-kafka-net
