name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false  # DMG gateway submodule not needed for CI

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check — deploy scripts
        run: |
          echo "Checking deploy-to-qlik.js..."
          node -c deploy/deploy-to-qlik.js
          echo "Checking deploy-ui.js..."
          node -c deploy/deploy-ui.js
          echo "Checking zip-utils.js..."
          node -c deploy/zip-utils.js

      - name: Syntax check — generators
        run: |
          for f in generators/*.js; do
            echo "Checking $f..."
            node -c "$f"
          done

      - name: Validate JSON configs
        run: |
          echo "Checking config.example.json..."
          node -e "JSON.parse(require('fs').readFileSync('deploy/config.example.json','utf-8'))"
          echo "Checking data_products.json..."
          node -e "JSON.parse(require('fs').readFileSync('deploy/data_products.json','utf-8'))"
          echo "Checking glossary_terms.json..."
          node -e "JSON.parse(require('fs').readFileSync('deploy/glossary_terms.json','utf-8'))"
          echo "Checking automation templates..."
          for f in deploy/automations/*.json; do
            echo "  $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf-8'))"
          done
          echo "Checking pipeline bindings..."
          for p in mcg-batch-pipeline mcg-streaming-pipeline; do
            echo "  $p"
            node -e "JSON.parse(require('fs').readFileSync('deploy/pipelines/$p/qtcp_bindings_definition.json','utf-8'))"
          done

      - name: Pipeline project ZIP round-trip
        run: |
          for p in mcg-batch-pipeline mcg-streaming-pipeline; do
            echo "  $p"
            node -e "
              const { zipDirectory, unzipBuffer } = require('./deploy/zip-utils');
              const zip = zipDirectory('deploy/pipelines/$p', { exclude: ['README.md','schema','.vscode','.github','.gitignore','CLAUDE.md'] });
              const files = unzipBuffer(zip);
              if (files.length < 5) { console.error('Expected >=5 entries, got ' + files.length); process.exit(1); }
              console.log('$p ZIP round-trip OK: ' + files.length + ' entries, ' + zip.length + ' bytes');
            "
          done

      - name: Validate Docker Compose files
        run: |
          for f in infrastructure/docker-compose*.yml infrastructure/kafka/docker-compose.yml; do
            if [ -f "$f" ]; then
              echo "Validating $f..."
              docker compose -f "$f" config --quiet 2>/dev/null || echo "  Warning: $f may have external dependencies"
            fi
          done

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential hardcoded secrets..."
          # Check that config.json (with real secrets) is gitignored
          if git ls-files --error-unmatch deploy/config.json 2>/dev/null; then
            echo "ERROR: deploy/config.json is tracked by git!"
            exit 1
          fi
          echo "OK: deploy/config.json is not tracked."

      - name: Scan tracked files for secret patterns
        run: |
          echo "Scanning tracked files for high-signal secret patterns..."
          # Files that legitimately contain truncated example JWTs / placeholders.
          ALLOWLIST="README.md deploy/setup_guide.md generators/gen-setup-guide.js deploy/creation_guide.md deploy/demo_checklist.md"
          # Build the list of tracked files to scan, excluding the allowlist.
          # Keep only regular files (drops submodule/gitlink dir entries).
          FILES=$(git ls-files | grep -vxF -f <(printf '%s\n' $ALLOWLIST) | while IFS= read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done || true)
          if [ -z "$FILES" ]; then
            echo "No files to scan."
            exit 0
          fi
          # High-signal secret patterns: AWS keys, Slack tokens, OpenAI keys,
          # private key headers, and full Qlik/JWT tokens (header.payload.).
          PATTERN='AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{10,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.'
          # -E extended regex, -n line numbers, -I skip binary files.
          if echo "$FILES" | xargs -d '\n' grep -EnI "$PATTERN" ; then
            echo "ERROR: Potential hardcoded secret found in tracked files (see file:line above)."
            exit 1
          fi
          echo "OK: no secret patterns detected in tracked files."

  python-validate:
    name: Validate Python Simulators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check — simulators
        run: |
          for f in simulators/*.py; do
            echo "Checking $f..."
            python -m py_compile "$f"
          done

      - name: Validate simulator dependencies
        run: pip install -r simulators/requirements.txt --dry-run
