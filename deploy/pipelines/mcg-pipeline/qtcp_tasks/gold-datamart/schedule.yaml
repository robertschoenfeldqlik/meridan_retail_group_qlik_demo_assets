scheduling:
  - schedulingType: EVENT_BASED
    enabled: true
    description: Refresh gold marts when any silver task completes
    eventBasedScheduling:
      eventSchedulingType: ANY_INPUT_TASK
  - schedulingType: TIME_BASED
    enabled: true
    description: Daily full refresh at 06:00 UTC (after silver daily run)
    timeBasedScheduling:
      schedule:
        - 'RRULE:FREQ=DAILY;BYHOUR=6;BYMINUTE=0;BYSECOND=0'
      startDateTime: '2026-01-01T06:00:00.000Z'
      timezone: 'Etc/UTC'
