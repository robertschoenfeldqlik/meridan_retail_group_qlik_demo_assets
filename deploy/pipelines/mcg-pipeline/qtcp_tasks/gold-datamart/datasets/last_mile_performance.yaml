properties:
  name: last_mile_performance
  id: last_mile_performance
  type: CUSTOM
  inputDatasets:
    - taskId: silver-transform-4201
      datasetId: order_delivery_timeline
      name: order_delivery_timeline
    - taskId: silver-transform-4201
      datasetId: shipments_canonical
      name: shipments_canonical
    - taskId: silver-transform-4201
      datasetId: addresses_standardized
      name: addresses_standardized
  customDatasetSettings:
    incremental: false
    customSql:
      expressionStatement: |-
        SELECT
          t.carrier_code,
          COALESCE(s.destination_country, 'UNKNOWN') AS destination_country,
          COUNT(*) AS orders,
          SUM(CASE WHEN t.order_status = 'DELIVERED' THEN 1 ELSE 0 END) AS delivered_orders,
          SUM(CASE WHEN t.delivered_late = TRUE THEN 1 ELSE 0 END) AS late_deliveries,
          ROUND(1.0 - SUM(CASE WHEN t.delivered_late = TRUE THEN 1 ELSE 0 END) * 1.0
            / NULLIF(SUM(CASE WHEN t.actual_delivery IS NOT NULL THEN 1 ELSE 0 END), 0), 3) AS on_time_rate,
          ROUND(AVG(CASE WHEN t.days_late > 0 THEN t.days_late END), 1) AS avg_days_late,
          SUM(CASE WHEN t.wismo_flag = TRUE THEN 1 ELSE 0 END) AS wismo_inquiries,
          ROUND(SUM(CASE WHEN t.wismo_flag = TRUE THEN 1 ELSE 0 END) * 1.0 / COUNT(*), 3) AS wismo_rate,
          SUM(CASE WHEN t.tracking_missing = TRUE THEN 1 ELSE 0 END) AS tracking_missing_count,
          ROUND(AVG(a.address_quality_score), 3) AS avg_address_quality
        FROM order_delivery_timeline t
        LEFT JOIN shipments_canonical s ON t.order_id = s.order_id
        LEFT JOIN addresses_standardized a ON t.contact_id = a.contact_id
        GROUP BY t.carrier_code, COALESCE(s.destination_country, 'UNKNOWN')
