scheduling:
  - schedulingType: EVENT_BASED
    enabled: true
    description: Run when any upstream landing task completes
    eventBasedScheduling:
      eventSchedulingType: ANY_INPUT_TASK
  - schedulingType: TIME_BASED
    enabled: true
    description: Daily full refresh at 05:30 UTC
    timeBasedScheduling:
      schedule:
        - 'RRULE:FREQ=DAILY;BYHOUR=5;BYMINUTE=30;BYSECOND=0'
      startDateTime: '2026-01-01T05:30:00.000Z'
      timezone: 'Etc/UTC'
