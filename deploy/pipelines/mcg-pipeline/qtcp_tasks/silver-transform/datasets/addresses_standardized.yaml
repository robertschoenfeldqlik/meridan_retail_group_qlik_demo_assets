properties:
  name: addresses_standardized
  id: addresses_standardized
  type: CUSTOM
  inputDatasets:
    - taskId: crm-landing-4102
      name: sf_contacts
  customDatasetSettings:
    incremental: false
    customSql:
      expressionStatement: |-
        SELECT
          Id AS contact_id,
          FirstName AS first_name,
          LastName AS last_name,
          Email AS email,
          Phone AS phone,
          MailingStreet AS street_raw,
          CASE
            WHEN UPPER(TRIM(MailingCity)) IN ('A''DAM', 'AMSTERDAM') THEN 'AMSTERDAM'
            WHEN UPPER(TRIM(MailingCity)) IN ('R''DAM', 'ROTTERDAM') THEN 'ROTTERDAM'
            ELSE UPPER(TRIM(MailingCity))
          END AS city,
          CASE
            WHEN UPPER(TRIM(MailingState)) IN ('NH', 'NOORD-HOLLAND', 'NORTH HOLLAND') THEN 'NOORD-HOLLAND'
            WHEN UPPER(TRIM(MailingState)) IN ('ZH', 'ZUID-HOLLAND', 'SOUTH HOLLAND') THEN 'ZUID-HOLLAND'
            ELSE UPPER(TRIM(MailingState))
          END AS state_region,
          UPPER(REPLACE(MailingPostalCode, ' ', '')) AS postal_code,
          CASE
            WHEN UPPER(TRIM(MailingCountry)) IN ('NL', 'NETHERLANDS', 'NIEDERLANDE', 'NEDERLAND', 'THE NETHERLANDS') THEN 'NL'
            WHEN UPPER(TRIM(MailingCountry)) IN ('DE', 'GERMANY', 'DEUTSCHLAND') THEN 'DE'
            WHEN UPPER(TRIM(MailingCountry)) IN ('GB', 'UK', 'UNITED KINGDOM') THEN 'GB'
            WHEN UPPER(TRIM(MailingCountry)) IN ('US', 'USA', 'UNITED STATES') THEN 'US'
            ELSE UPPER(TRIM(MailingCountry))
          END AS country_iso,
          (CASE WHEN MailingStreet IS NOT NULL AND TRIM(MailingStreet) <> '' THEN 0.25 ELSE 0.0 END
           + CASE WHEN MailingCity IS NOT NULL AND TRIM(MailingCity) <> '' THEN 0.25 ELSE 0.0 END
           + CASE WHEN MailingPostalCode IS NOT NULL AND TRIM(MailingPostalCode) <> '' THEN 0.25 ELSE 0.0 END
           + CASE WHEN MailingCountry IS NOT NULL AND TRIM(MailingCountry) <> '' THEN 0.25 ELSE 0.0 END
          ) AS address_quality_score
        FROM sf_contacts
