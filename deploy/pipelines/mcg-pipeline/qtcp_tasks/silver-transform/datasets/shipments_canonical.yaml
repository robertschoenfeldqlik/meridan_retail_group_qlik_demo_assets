properties:
  name: shipments_canonical
  id: shipments_canonical
  type: CUSTOM
  inputDatasets:
    - taskId: wms-cdc-landing-4101
      name: shipments
  customDatasetSettings:
    incremental: false
    customSql:
      expressionStatement: |-
        SELECT
          shipment_id,
          tracking_number,
          carrier_code,
          order_id,
          shipment_status AS shipment_status_raw,
          CASE
            WHEN LOWER(shipment_status) IN ('label_created', 'shipment_info', 'paketankuendigung', 'pending pickup', 'objeto postado', 'registered') THEN 'CREATED'
            WHEN LOWER(shipment_status) IN ('picked_up', 'pickup', 'abgeholt', 'picked up', 'coletado', 'collected') THEN 'PICKED_UP'
            WHEN LOWER(shipment_status) IN ('in_transit', 'transit', 'in zustellung', 'arrived at hub', 'em transito', 'moving') THEN 'IN_TRANSIT'
            WHEN LOWER(shipment_status) IN ('on_vehicle', 'out_for_delivery', 'in auslieferung', 'on vehicle', 'saiu para entrega', 'on the way') THEN 'OUT_FOR_DELIVERY'
            WHEN LOWER(shipment_status) IN ('delivered', 'zugestellt', 'completed', 'objeto entregue ao destinatario', 'delivered ok') THEN 'DELIVERED'
            WHEN LOWER(shipment_status) IN ('delivery_exception', 'failure', 'zustellversuch', 'pending reschedule', 'nao entregue', 'not delivered') THEN 'FAILED'
            ELSE 'UNKNOWN'
          END AS shipment_status,
          status_datetime AS status_datetime_raw,
          origin_facility,
          destination_address,
          UPPER(TRIM(destination_city)) AS destination_city,
          CASE
            WHEN UPPER(TRIM(destination_country)) IN ('NL', 'NETHERLANDS', 'NIEDERLANDE', 'NEDERLAND', 'THE NETHERLANDS') THEN 'NL'
            WHEN UPPER(TRIM(destination_country)) IN ('DE', 'GERMANY', 'DEUTSCHLAND', 'ALLEMAGNE') THEN 'DE'
            WHEN UPPER(TRIM(destination_country)) IN ('GB', 'UK', 'UNITED KINGDOM', 'GREAT BRITAIN', 'ENGLAND') THEN 'GB'
            WHEN UPPER(TRIM(destination_country)) IN ('US', 'USA', 'UNITED STATES', 'UNITED STATES OF AMERICA') THEN 'US'
            WHEN UPPER(TRIM(destination_country)) IN ('SG', 'SINGAPORE', 'SINGAPUR') THEN 'SG'
            WHEN UPPER(TRIM(destination_country)) IN ('JP', 'JAPAN', 'JAPON') THEN 'JP'
            WHEN UPPER(TRIM(destination_country)) IN ('BR', 'BRAZIL', 'BRASIL') THEN 'BR'
            WHEN UPPER(TRIM(destination_country)) IN ('NG', 'NIGERIA') THEN 'NG'
            ELSE UPPER(TRIM(destination_country))
          END AS destination_country,
          estimated_delivery,
          actual_delivery,
          delivery_attempts,
          exception_code,
          CASE
            WHEN LOWER(weight_unit) IN ('lb', 'lbs') THEN ROUND(weight_value * 0.4536, 2)
            ELSE weight_value
          END AS weight_kg,
          CASE
            WHEN LOWER(shipment_status) IN ('delivered', 'zugestellt', 'completed', 'objeto entregue ao destinatario', 'delivered ok')
              AND actual_delivery IS NULL
            THEN TRUE ELSE FALSE
          END AS delivered_without_timestamp,
          created_at,
          updated_at
        FROM shipments
