properties:
  name: products_harmonized
  id: products_harmonized
  type: CUSTOM
  inputDatasets:
    - datasetId: crm_products
      taskId: crm-landing-4102
  customDatasetSettings:
    incremental: false
    customSql:
      expressionStatement: |-
        SELECT
          sku AS sku,
          legacy_sku_americas AS legacy_sku_americas,
          legacy_sku_eu AS legacy_sku_eu,
          product_name AS product_name,
          category_l1 AS category_l1,
          category_l2 AS category_l2,
          COALESCE(category_l3, 'UNCLASSIFIED') AS category_l3,
          COALESCE(
            NULLIF(weight_kg, 0),
            AVG(NULLIF(weight_kg, 0)) OVER (PARTITION BY category_l1)
          ) AS weight_kg,
          CASE WHEN weight_kg IS NULL OR weight_kg = 0 THEN TRUE ELSE FALSE END AS weight_imputed,
          country_of_origin AS country_of_origin,
          CASE WHEN country_of_origin IS NULL AND category_l1 = 'Grocery' THEN TRUE ELSE FALSE END AS origin_missing_compliance_risk,
          supplier_name AS supplier_name_raw,
          CASE
            WHEN UPPER(supplier_name) LIKE 'SAMSUNG%' THEN 'Samsung Electronics'
            WHEN UPPER(supplier_name) LIKE 'FRESHDIRECT%' OR UPPER(supplier_name) LIKE 'FRESH DIRECT%' THEN 'FreshDirect'
            WHEN UPPER(supplier_name) LIKE 'TRANSFRIO%' OR UPPER(supplier_name) LIKE 'TRANS FRIO%' THEN 'TransFrio'
            ELSE TRIM(supplier_name)
          END AS supplier_canonical
        FROM crm_products
