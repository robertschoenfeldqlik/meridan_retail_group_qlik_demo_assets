properties:
  name: order_delivery_timeline
  id: order_delivery_timeline
  type: CUSTOM
  inputDatasets:
    - datasetId: crm_orders
      taskId: crm-landing-4102
    - datasetId: shipments
      taskId: wms-cdc-landing-4101
  customDatasetSettings:
    incremental: false
    customSql:
      expressionStatement: |-
        SELECT
          o.order_id AS order_id,
          o.contact_id AS contact_id,
          o.order_date AS order_date,
          o.sku AS sku,
          o.product_name AS product_name,
          o.fulfillment_method AS fulfillment_method,
          o.carrier AS carrier_code,
          o.tracking_number AS tracking_number,
          o.order_status AS order_status,
          o.promised_delivery AS promised_delivery,
          o.actual_delivery AS actual_delivery,
          CASE WHEN o.tracking_number IS NULL THEN TRUE ELSE FALSE END AS tracking_missing,
          CASE
            WHEN o.actual_delivery IS NOT NULL AND o.actual_delivery > o.promised_delivery THEN TRUE
            ELSE FALSE
          END AS delivered_late,
          CASE
            WHEN o.actual_delivery IS NOT NULL THEN DATEDIFF(o.actual_delivery, o.promised_delivery)
            ELSE NULL
          END AS days_late,
          o.wismo_flag AS wismo_flag,
          s.shipment_id,
          s.shipment_status AS carrier_status_raw,
          s.delivery_attempts,
          s.exception_code
        FROM crm_orders o
        LEFT JOIN shipments s
          ON o.order_id = s.order_id
