properties:
  name: supply_chain_health
  id: supply_chain_health
  type: CUSTOM
  inputDatasets:
    - taskId: silver-transform-4201
      datasetId: inventory_reconciled
    - taskId: silver-transform-4201
      datasetId: warehouse_events_clean
  customDatasetSettings:
    incremental: false
    customSql:
      expressionStatement: |-
        SELECT
          i.location_id,
          COUNT(*) AS sku_positions,
          SUM(i.quantity_on_hand) AS total_on_hand,
          SUM(CASE WHEN i.phantom_suspect = TRUE THEN 1 ELSE 0 END) AS phantom_suspect_count,
          SUM(CASE WHEN i.logic_error = TRUE THEN 1 ELSE 0 END) AS negative_qty_count,
          SUM(CASE WHEN i.lot_missing = TRUE THEN 1 ELSE 0 END) AS lot_missing_count,
          ROUND(AVG(i.trust_score), 3) AS avg_trust_score,
          MAX(e.cycle_count_events) AS cycle_count_events,
          MAX(e.avg_cycle_count_variance) AS avg_cycle_count_variance
        FROM inventory_reconciled i
        LEFT JOIN (
          SELECT
            warehouse_id,
            COUNT(*) AS cycle_count_events,
            ROUND(AVG(ABS(cycle_count_variance)), 2) AS avg_cycle_count_variance
          FROM warehouse_events_clean
          WHERE event_type = 'CYCLE_COUNT'
          GROUP BY warehouse_id
        ) e ON i.location_id = e.warehouse_id
        GROUP BY i.location_id
