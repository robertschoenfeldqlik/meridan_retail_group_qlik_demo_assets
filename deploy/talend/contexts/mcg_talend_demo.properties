# MCG Talend context — demo defaults (import as Talend context group "MCG_Demo")
# Real credentials belong in TMC environment contexts, never in git.

# Salesforce (Job 1 source)
sf_login_url=https://login.salesforce.com
sf_username=integration@mcg-demo.example
sf_password=
sf_security_token=
sf_watermark=1970-01-01T00:00:00Z

# Nominatim geocoding (public OSM instance — respect the usage policy)
nominatim_base_url=https://nominatim.openstreetmap.org/search
nominatim_user_agent=MCG-Demo-Talend/1.0 (contact@mcg.example)
nominatim_throttle_ms=1100

# Staging between Job 1 and Job 2
staging_dir=/tmp/mcg_talend

# Qlik Cloud (Job 2 tQlikOutput target + Job 1 stewardship webhook)
qlik_tenant_url=
qlik_api_key=
qlik_space=MCG Demo - Development
qlik_qvd_name=MCG_SF_Addresses_Validated.qvd
qlik_webhook_url=
