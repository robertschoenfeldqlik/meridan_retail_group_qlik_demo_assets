# MCG Talend context — demo defaults (import as Talend context group "MCG_Demo")
# Real credentials belong in TMC environment contexts, never in git.

# Salesforce (Job 1 source)
sf_login_url=https://login.salesforce.com
sf_username=integration@mcg-demo.example
sf_password=
sf_security_token=
sf_watermark=1970-01-01T00:00:00Z

# Batch size — this is a demo, keep it small. 100–1000 rows is the sweet spot:
# at the Nominatim 1 req/s policy floor a 100-row batch finishes in ~2 min and a
# 1000-row batch in ~18 min, less once the dedupe cache warms up.
sf_batch_limit=500

# Geocoding — public OSM Nominatim (free, no API key, no subscription).
# Nominatim has NO bulk endpoint and its usage policy caps callers at 1 req/s,
# so BulkGeocoder takes the whole batch in one call and fans it out internally
# behind a shared rate limiter. Do NOT lower the throttle below 1100 ms.
nominatim_base_url=https://nominatim.openstreetmap.org/search
nominatim_user_agent=MCG-Demo-Talend/1.0 (contact@mcg.example)
nominatim_throttle_ms=1100
# 1 for the public instance (the policy caps you anyway). Raise only if you
# later point nominatim_base_url at a self-hosted Nominatim/Photon container.
geocode_max_concurrent=1
# Wall-clock ceiling for the whole batch. Anything not geocoded when the budget
# expires is routed to Stewardship rather than stalling the job. 0 = no limit.
geocode_budget_ms=900000

# Staging between Job 1 and Job 2
staging_dir=/tmp/mcg_talend

# Routing outputs
#   GPS resolved     -> Open Lakehouse (Apache Iceberg)
#   GPS not resolved -> Qlik Stewardship sprint
stewardship_dir=/tmp/mcg_talend/stewardship
stewardship_sprint=Address Cleanup

# ---------------------------------------------------------------------------
# Open Lakehouse target - the job writes CSV to S3 (tS3Connection/tS3Put).
# Loading S3 -> Apache Iceberg is a downstream step (Athena MERGE, a Qlik Cloud
# Pipeline, or Spark/Trino) - see BUILD_BULK_ADDRESS_JOB.md section 4.
# ---------------------------------------------------------------------------
olh_staging_dir=/tmp/mcg_talend/olh
s3_bucket=mcg-open-lakehouse
s3_prefix=talend/addresses
# AWS auth: prefer the instance/role credential chain. Leave blank to use it.
aws_region=eu-west-1
aws_access_key_id=
aws_secret_access_key=

# Downstream Iceberg target (not written by this job - used by the load step)
iceberg_database=silver
iceberg_table=addresses_geocoded
iceberg_warehouse=s3://mcg-open-lakehouse/warehouse/

# Qlik Cloud (stewardship sprint API + notifications)
qlik_tenant_url=https://qppqtcenterprise.us.qlikcloud.com
qlik_api_key=
qlik_data_space_id=6a31b72af70980dd4048c444
qlik_webhook_url=
